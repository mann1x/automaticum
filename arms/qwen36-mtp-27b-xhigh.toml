# First real arm of milestone 2 (decisions D55 and D59). The context window
# and the sampler are the owner's values of 2026-10-13; they are also what
# the model tag declares. Thinking effort is the one value still taken from
# the old harness's last manual arm.
#
# Guards and compaction come from the base: all on (decision D60).
extends = "base"
endpoint = "xollama-windows-2"

[model]
provider = "xollama"
model = "qwen36-base-mtp_tb:27b-q4km-128k"
context_window = 131072     # "128k": what the tag declares as num_ctx
output_tokens = 0           # left to the SDK's rule

[thinking]
owner = "arm"
enabled = true
effort = "xhigh"

[sampler]
owner = "arm"
name = "owner-2026-10-13"
temperature = 1.0
top_k = 20
repeat_last_n = 0
repeat_penalty = 1.0
presence_penalty = 0.0

[limits]
wall_s = 7200
idle_s = 1800
