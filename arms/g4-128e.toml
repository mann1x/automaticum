# The Gemma-4 26B-A4B loop test with omnimergekit (D98): what every arm of it
# shares. Not runnable: it names no endpoint and no model.
#
# The owner's values of 2026-10-23: thinking on (left to the server, see
# [thinking]), a window of 256000, a wall
# limit of 1 h and an idle limit of 15 min, SDK release 4.100.258. The
# sampler is the owner's serving configuration for this model (the 8244
# start script: temperature 0.7, top_p 0.95, top_k 64, repeat penalty 1.13
# over the last 72, presence penalty 0.25), owned by the arm so that every
# request carries it and the wire shows it. Guards and compaction come from
# the base: all on. The two guard arms of each server differ only in
# guards.stop_at_first_trip (D99). The owner narrowed the test to one
# server (the BF16 file, end token 106, Google's template): g4-128e-bf16-*.
template = true
extends = "base"

[model]
provider = "openai-compatible"
context_window = 256000
output_tokens = 0           # left to the SDK's rule

# Thinking on, as the owner asked, is the server's: SDK 4.100.258 sends
# nothing for "thinking on" to an OpenAI-compatible server (it sends
# reasoning_budget_tokens only with an effort level, which the owner did not
# name), and llama-server turns Gemma-4's thinking on in its template
# settings. omnimergekit starts every server of this test with thinking on;
# each run shows it in its thinking.blocks.
[thinking]
owner = "tag"

[sampler]
owner = "arm"
name = "owner-8244-2026-10-23"
temperature = 0.7
top_p = 0.95
top_k = 64
repeat_penalty = 1.13
repeat_last_n = 72
presence_penalty = 0.25

[limits]
wall_s = 3600
idle_s = 900

[harness]
sdk_release = "4.100.258"
