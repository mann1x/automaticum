# the owner's choice of 2026-10-23 among the guards SDK 4.100.259 announces.
# Counted and not stopping: the no-tool-call, unparsed-tool-call and
# announced-intent nudges, the completion guards, struggle.
extends = "g4-128e"
endpoint = "g4-128e-bf16"

[model]
model = "gemma-4-26b-a4b-it-bf16-eos106"

[guards]
stop_on = [
