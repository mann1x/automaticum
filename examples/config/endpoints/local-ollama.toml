kind = "ollama"
# The address as a lane's container reaches it: the Docker bridge's gateway,
# not localhost, and never an address that listens on every interface.
base_url = "http://172.17.0.1:11434"
# A server that listens only on 127.0.0.1: the daemon listens on base_url's
# address and forwards to it (030 §4.3). `automaticum run server` writes it.
# forward_to = "127.0.0.1:11434"
host = "linux-gpu-1"
capacity = 1

# What the server runs on, as you declare it. Every run records it as
# declared, not measured.
[hardware]
gpu = "NVIDIA GeForce RTX 3090"
vram_gb = 24
notes = ""

# What a million tokens cost, if the endpoint charges for them (070 §2):
# every run records it as declared, and its analysis gives cost.money in
# that currency. Leave the table out for a server that charges nothing.
# [price]
# currency = "EUR"
# input_per_mtok = 0.0
# cached_input_per_mtok = 0.0
# output_per_mtok = 0.0
