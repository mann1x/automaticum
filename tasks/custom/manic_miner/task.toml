# manic_miner: repair a broken browser game.
#
# Ported from the old harness (docs/specs/100-legacy-import.md). Versions 1 to
# 3 are that harness's; version 4 is the first in automaticum: same seed file
# and oracle logic as version 3, in a container lane, with a rebuilt oracle
# binary. Version 4 is a comparability boundary (docs/specs/060 section 5.1).
#
# Version 5 (2026-11-12): the oracle's top-level `ok` is the whole verdict --
# the page runs and game_logic.ok -- instead of only "the page runs"; the old
# meaning is printed as `runs`. The PASS pattern is unchanged and already
# required game_logic.ok, so v4 and v5 verdicts are comparable: the agent now
# reads `"ok":false` while game_logic fails, a change of what it is told, not
# of the measurement (docs/specs/060 section 5.1).
#
# Version 6 (2026-11-19): a comparability boundary, used from the new test
# campaign on; earlier runs are not rescored (owner's decision). The v5 oracle
# passed an unplayable game: every trap placed the player itself, so where a
# cavern puts the player, finishing a cavern, running out of air, RESTART and
# drawing the player were never exercised, and warnings never failed. v5's own
# known-good spawned the player inside a tile (23 of 40 seeds), never left
# cavern 1, ignored O2 at 0 and drew no player. v6:
#   - game_logic.ok needs every trap clean: a warning fails, and a trap that
#     warns is not counted in `passed` (owner's rule);
#   - five new traps: spawn, advance, death, restart, draw (28 in all);
#   - the level trap fails when setupLevel(n) builds a different cavern than
#     new Level(n);
#   - the canvas stub returns one context per element, as a browser does;
#   - known-good is fixed (spawn, cavern advance, O2 death, a drawn player);
#     v5's is kept as known-bad-v5-unplayable, and each new check has a fixture
#     that breaks only it.

id = "manic_miner"
suite = "custom"
version = 6
layers = ["typescript"]
default_answer = "Use your own judgement and continue."

prompt = """
check manic_miner.html, it's not working. Run `./run_game manic_miner.html` to see whether it actually works -- it loads the page, starts the game, pumps animation frames and tests the game's rules, and prints what went wrong. Use `check_file` after each edit to see straight away whether what you wrote parses, and run the command again before you tell me you are done -- do not declare it fixed on a reading of the source."""

[labels]
language = "javascript"
family = "repair"
tier = "hard"

[limits]
wall_s = 7200
oracle_s = 120

# The files the agent starts from, copied into an empty workspace.
[workspace]
seed = "seed"

# Something built from the task's files before it can run. The build runs in
# a container with no network; the result is stored by hash, and the hash is
# pinned here. A rebuild that gives another hash is refused.
[[artefact]]
name = "run_game"
image = "node@sha256:86f07bc9c5dce4578cf37e5a418b7bfc7f817cda25cde66e2b66e95ed86c4567"
inputs = ["oracle/build.mjs", "oracle/run_game.logic.js"]
command = ["node", "/task/oracle/build.mjs", "/task/oracle/run_game.logic.js", "/out/run_game"]
output = "run_game"
sha256 = "465ac2e845671a6411e0c861e6912662c8c0d467cc4e9e46555f7467c55720a3"

# The agent's copy of the oracle: it may run it, and cannot read its source.
[[workspace.install]]
artefact = "run_game"
path = "run_game"
mode = "0555"

# The verdict. The harness runs its own copy of the artefact after the agent
# has stopped, on the workspace's files, in a container with no network. The
# program exits 0 either way, so it is judged by the pattern.
[[oracle]]
name = "game"
primary = true
artefact = "run_game"
image = "node@sha256:86f07bc9c5dce4578cf37e5a418b7bfc7f817cda25cde66e2b66e95ed86c4567"
command = ["./run_game", "manic_miner.html"]
expect_pattern = '"ok":\s*true.*"frames_run":\s*[1-9][0-9]*.*"reached_playing":\s*true.*"game_logic":\s*\{"ok":\s*true'
timeout_s = 120

# The oracle must pass the known-good pages and fail the others, or the task cannot run.

[[fixture]]
name = "known-good"
expect = "pass"
[fixture.files]
"manic_miner.html" = "fixtures/known-good.html"

[[fixture]]
name = "known-good-renamed-context"
expect = "pass"
[fixture.files]
"manic_miner.html" = "fixtures/known-good-renamed-context.html"

[[fixture]]
name = "seed"
expect = "fail"
[fixture.files]
"manic_miner.html" = "seed/manic_miner.html"

[[fixture]]
name = "weak-jump"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-weak-jump.html"

[[fixture]]
name = "v5-unplayable"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-v5-unplayable.html"

[[fixture]]
name = "no-spawn"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-no-spawn.html"

[[fixture]]
name = "no-advance"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-no-advance.html"

[[fixture]]
name = "no-death"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-no-death.html"

[[fixture]]
name = "death-no-overlay"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-death-no-overlay.html"

[[fixture]]
name = "restart-keeps-o2"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-restart-keeps-o2.html"

[[fixture]]
name = "no-draw"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-no-draw.html"

[[fixture]]
name = "level-off-by-one"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-level-off-by-one.html"

[[fixture]]
name = "sx-no-retry"
expect = "fail"
[fixture.files]
"manic_miner.html" = "fixtures/known-bad-sx-no-retry.html"
