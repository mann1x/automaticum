# py_ledger: fix an invoicing library so it follows its README (training task, bm-889 rollout pool).
#
# A training task: it is trained on and never scored as an eval. The checker is compiled (as
# manic_miner's run_game): the agent can run ./run_tests and read its verdict, not its tests.

id = "py_ledger"
suite = "train-ml"
version = 1
training = true
layers = ["python"]
default_answer = "Use your own judgement and continue."

prompt = """
Our invoices from the `ledger` package are wrong: some totals are off by a cent, and discounts don't come out the way README.md says they should. Fix the package so it follows the rules in README.md. Run `./run_tests` to check your work -- it prints a JSON verdict listing the checks that fail -- and run it again before you say you are done."""

[labels]
language = "python"
family = "bug-fix"
tier = "short"

[limits]
wall_s = 1500
idle_s = 600
oracle_s = 180

[workspace]
seed = "seed"

[[artefact]]
name = "run_tests"
image = "node@sha256:86f07bc9c5dce4578cf37e5a418b7bfc7f817cda25cde66e2b66e95ed86c4567"
inputs = ["oracle/build.mjs", "oracle/run_tests.logic.js"]
command = ["node", "/task/oracle/build.mjs", "/task/oracle/run_tests.logic.js", "/out/run_tests"]
output = "run_tests"
sha256 = "b6d4e4c2c68b7a11864f9a22ca5c52c331aed387b0ca60a72cfd61ffa80259e4"

[[workspace.install]]
artefact = "run_tests"
path = "run_tests"
mode = "0555"

[[oracle]]
name = "tests"
primary = true
artefact = "run_tests"
image = "python@sha256:14a4933e6cef421424f7a66d89a3f4eafcbd0d90e0a822251f298e05132dc735"
command = ["./run_tests"]
expect_pattern = '"ok":true'
timeout_s = 180

[[fixture]]
name = "known-good"
expect = "pass"
[fixture.files]
"ledger/money.py" = "fixtures/good/ledger/money.py"
"ledger/invoice.py" = "fixtures/good/ledger/invoice.py"

[[fixture]]
name = "seed"
expect = "fail"

[[fixture]]
name = "half-even"
expect = "fail"
[fixture.files]
"ledger/money.py" = "fixtures/bad-even/ledger/money.py"
"ledger/invoice.py" = "fixtures/bad-even/ledger/invoice.py"
