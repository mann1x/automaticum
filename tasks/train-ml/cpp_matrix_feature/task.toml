# cpp_matrix_feature: implement the missing operations of a C++17 CSR sparse-matrix library (training task,
# bm-889 rollout pool).
#
# A training task: it is trained on and never scored as an eval. The checker is compiled (as
# manic_miner's run_game): the agent can run ./run_tests and read its verdict, not its tests.
# Needs an exec /tmp in the oracle sandbox (the checker runs a compiled C++ test program).

id = "cpp_matrix_feature"
suite = "train-ml"
version = 1
training = true
layers = ["cpp"]
default_answer = "Use your own judgement and continue."

prompt = """
The `sparse` library in this repo only has the CSR container so far: transpose, the vector and matrix products, add, prune, diagonal and the Matrix Market reader are still stubs, so `spinfo` can't do anything useful yet. Please implement them as specified in README.md (the canonical-form rules there apply to every result). Keep the public headers' API and the Makefile build working. Run `./run_tests` to check your work -- it prints a JSON verdict listing the checks that fail -- and run it again before you say you are done."""

[labels]
language = "cpp"
family = "feature"
tier = "long"

[limits]
wall_s = 2700
idle_s = 600
oracle_s = 300

[workspace]
seed = "seed"

[[artefact]]
name = "run_tests"
image = "node@sha256:86f07bc9c5dce4578cf37e5a418b7bfc7f817cda25cde66e2b66e95ed86c4567"
inputs = ["oracle/build.mjs", "oracle/run_tests.logic.js"]
command = ["node", "/task/oracle/build.mjs", "/task/oracle/run_tests.logic.js", "/out/run_tests"]
output = "run_tests"
sha256 = "4577689e9f6d27a2b981d80775d0c815fec59d3167dc9eaa184293c96d2cc058"

[[workspace.install]]
artefact = "run_tests"
path = "run_tests"
mode = "0555"

[[oracle]]
name = "tests"
primary = true
artefact = "run_tests"
image = "gcc@sha256:db19db55a3bd1f836212a76854c4f6c7c4ccb0c9a9426dbf542e3505bc8cdfec"
command = ["./run_tests"]
expect_pattern = '"ok":true'
timeout_s = 300

[[fixture]]
name = "known-good"
expect = "pass"
[fixture.files]
"src/csr_ops.cpp" = "fixtures/good/src/csr_ops.cpp"
"src/mm_io.cpp" = "fixtures/good/src/mm_io.cpp"

[[fixture]]
name = "seed"
expect = "fail"

[[fixture]]
name = "symmetric-diagonal-doubled"
expect = "fail"
[fixture.files]
"src/csr_ops.cpp" = "fixtures/bad-symdiag/src/csr_ops.cpp"
"src/mm_io.cpp" = "fixtures/bad-symdiag/src/mm_io.cpp"

[[fixture]]
name = "product-keeps-zeros"
expect = "fail"
[fixture.files]
"src/csr_ops.cpp" = "fixtures/bad-spgemm-zero/src/csr_ops.cpp"
"src/mm_io.cpp" = "fixtures/bad-spgemm-zero/src/mm_io.cpp"
