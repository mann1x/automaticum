# The demo task in which the agent switches itself to act mode (the
# extension's switch_to_act_mode, 040 §6.2) after the scripted user approves
# its plan with a message, for the harness's own tests; run it with an arm
# in plan mode. The file must say 42.

id = "plan-switch"
suite = "demo"
version = 1
default_answer = "Continue."
prompt = "answer.txt has the wrong number in it. Change it to 42."

[limits]
wall_s = 300
oracle_s = 30

[workspace]
seed = "seed"

[[oracle]]
name = "check"
primary = true
image = "debian@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587"
command = ["sh", "-c", "grep -q 'is 42\\.' answer.txt && echo RESULT ok || echo RESULT wrong"]
expect_pattern = 'RESULT ok'
timeout_s = 30

[[fixture]]
name = "good"
expect = "pass"
[fixture.files]
"answer.txt" = "fixtures/good.txt"

[[fixture]]
name = "seed"
expect = "fail"
[fixture.files]
"answer.txt" = "seed/answer.txt"


[user.default]
approval = "approve"
answer = "Continue."

[[user.rule]]
on = "plan"
do = "queue"
text = "Looks good, go ahead."
