# The demo task with a scripted user that restores a checkpoint's messages
# and starts over in a new session (040 §6.2, D86), for the harness's own
# tests. The file must say 42.

id = "fork"
suite = "demo"
version = 1
default_answer = "Continue."
prompt = "answer.txt has the wrong number in it. Change it to 42."

[limits]
wall_s = 300
oracle_s = 30

[workspace]
seed = "seed"

[[oracle]]
name = "check"
primary = true
image = "debian@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587"
command = ["sh", "-c", "grep -q 'is 42\\.' answer.txt && echo RESULT ok || echo RESULT wrong"]
expect_pattern = 'RESULT ok'
timeout_s = 30

[[fixture]]
name = "good"
expect = "pass"
[fixture.files]
"answer.txt" = "fixtures/good.txt"

[[fixture]]
name = "seed"
expect = "fail"
[fixture.files]
"answer.txt" = "seed/answer.txt"

[user.default]
approval = "approve"
answer = "Continue."

[[user.rule]]
on = "turn"
turn = 3
do = "restore"
restore = "messages"
checkpoint = 1
text = "Start over: read answer.txt, then change the number."
