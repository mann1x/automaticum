# sh_user_audit: finish an offline account-audit tool (passwd/shadow/group/sudoers/authorized_keys snapshot) (training task, bm-889 rollout pool).
#
# A training task: it is trained on and never scored as an eval. The checker is compiled (as
# manic_miner's run_game): the agent can run ./run_tests and read its verdict, not its tests.

id = "sh_user_audit"
suite = "train-sh"
version = 1
training = true
layers = ["python"]
default_answer = "Use your own judgement and continue."

prompt = """
Security wants the quarterly account audit by Friday. The `audit.sh` tool in this repo is only half done: the uid and password-aging checks exist but QA found they report the wrong accounts in some cases, and the home-directory, SSH key and sudo checks are still empty stubs. Please finish it so that it does everything README.md describes, exactly in the format given there (they diff our reports between quarters). It must only read the snapshot directory it is given. Run `./run_tests` to check your work -- it prints a JSON verdict listing the checks that fail -- and run it again before you say you are done."""

[labels]
language = "bash"
family = "feature"
tier = "long"

[limits]
wall_s = 2700
idle_s = 600
oracle_s = 300

[workspace]
seed = "seed"

[[artefact]]
name = "run_tests"
image = "node@sha256:86f07bc9c5dce4578cf37e5a418b7bfc7f817cda25cde66e2b66e95ed86c4567"
inputs = ["oracle/build.mjs", "oracle/run_tests.logic.js"]
command = ["node", "/task/oracle/build.mjs", "/task/oracle/run_tests.logic.js", "/out/run_tests"]
output = "run_tests"
sha256 = "1c835bfccaf07ceabc4dd8bdbaca98fc9112389123c6e5b6c231ac1f056db7f2"

[[workspace.install]]
artefact = "run_tests"
path = "run_tests"
mode = "0555"

[[oracle]]
name = "tests"
primary = true
artefact = "run_tests"
image = "python@sha256:14a4933e6cef421424f7a66d89a3f4eafcbd0d90e0a822251f298e05132dc735"
command = ["./run_tests"]
expect_pattern = '"ok":true'
timeout_s = 300

[[fixture]]
name = "known-good"
expect = "pass"
[fixture.files]
"checks/uid.sh" = "fixtures/good/checks/uid.sh"
"checks/aging.sh" = "fixtures/good/checks/aging.sh"
"checks/homes.sh" = "fixtures/good/checks/homes.sh"
"checks/keys.sh" = "fixtures/good/checks/keys.sh"
"checks/sudo.sh" = "fixtures/good/checks/sudo.sh"

[[fixture]]
name = "seed"
expect = "fail"

[[fixture]]
name = "sudoers-d-unfiltered"
expect = "fail"
[fixture.files]
"checks/uid.sh" = "fixtures/bad-sudo/checks/uid.sh"
"checks/aging.sh" = "fixtures/bad-sudo/checks/aging.sh"
"checks/homes.sh" = "fixtures/bad-sudo/checks/homes.sh"
"checks/keys.sh" = "fixtures/bad-sudo/checks/keys.sh"
"checks/sudo.sh" = "fixtures/bad-sudo/checks/sudo.sh"
