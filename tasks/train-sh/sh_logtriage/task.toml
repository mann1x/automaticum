# sh_logtriage: fix an access-log triage script so its report matches README.md (training task, bm-889 rollout pool).
#
# A training task: it is trained on and never scored as an eval. The checker is compiled (as
# manic_miner's run_game): the agent can run ./run_tests and read its verdict, not its tests.

id = "sh_logtriage"
suite = "train-sh"
version = 2
training = true
layers = ["python"]
default_answer = "Use your own judgement and continue."

prompt = """
The on-call log summary (`bin/logsum.sh`) can't be trusted any more. Last night it choked on the rotated `.gz` logs, the hourly status table came out in a weird order once the month rolled over, and the top-paths and slow-request sections don't agree with what README.md says they should show. Please fix the script (and `lib/parse.awk` if needed) so the report follows README.md exactly. Run `./run_tests` to check your work -- it prints a JSON verdict listing the checks that fail -- and run it again before you say you are done."""

[labels]
language = "bash"
family = "bug-fix"
tier = "short"

[limits]
wall_s = 1500
idle_s = 600
oracle_s = 180

[workspace]
seed = "seed"

[[artefact]]
name = "run_tests"
image = "node@sha256:86f07bc9c5dce4578cf37e5a418b7bfc7f817cda25cde66e2b66e95ed86c4567"
inputs = ["oracle/build.mjs", "oracle/run_tests.logic.js"]
command = ["node", "/task/oracle/build.mjs", "/task/oracle/run_tests.logic.js", "/out/run_tests"]
output = "run_tests"
sha256 = "c645bdebac8183d89e0dc82890a5402109060c4969db340beb715b3afc117ea6"

[[workspace.install]]
artefact = "run_tests"
path = "run_tests"
mode = "0555"

[[oracle]]
name = "tests"
primary = true
artefact = "run_tests"
image = "python@sha256:14a4933e6cef421424f7a66d89a3f4eafcbd0d90e0a822251f298e05132dc735"
command = ["./run_tests"]
expect_pattern = '"ok":true'
timeout_s = 180

[[fixture]]
name = "known-good"
expect = "pass"
[fixture.files]
"bin/logsum.sh" = "fixtures/good/bin/logsum.sh"
"lib/parse.awk" = "fixtures/good/lib/parse.awk"

[[fixture]]
name = "seed"
expect = "fail"

[[fixture]]
name = "request-field-unchecked"
expect = "fail"
[fixture.files]
"bin/logsum.sh" = "fixtures/bad-request/bin/logsum.sh"
"lib/parse.awk" = "fixtures/bad-request/lib/parse.awk"
