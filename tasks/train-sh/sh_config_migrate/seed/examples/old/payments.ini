; payments service -- owned by the billing team
name = payments
owner = billing@corp.example

[Server]
host = 0.0.0.0
port = 8080      ; public port, behind the LB
KeepAlive = Yes
workers = 4

[database]
url = "postgres://pay:s3cret#1@db-01/pay?sslmode=require"
pool = 10
pool = 20
timeout = 30 # seconds

[log]
level = info
file = /var/log/payments/app.log
json = off

[metrics]
# scraped by prometheus
path = /metrics
