# sh_backup_rotate: implement a daily/weekly/monthly backup rotation script against README.md (training task, bm-889 rollout pool).
#
# A training task: it is trained on and never scored as an eval. The checker is compiled (as
# manic_miner's run_game): the agent can run ./run_tests and read its verdict, not its tests.

id = "sh_backup_rotate"
suite = "train-sh"
version = 1
training = true
layers = ["python"]
default_answer = "Use your own judgement and continue."

prompt = """
The backup volume is at 91% again because nothing ever prunes /srv/backups. I started `rotate.sh` to apply a daily/weekly/monthly retention policy but only got as far as the option parsing. Please finish it so it does exactly what README.md describes -- the dry-run output, the report, the exit codes and all. It has to be safe: it may only ever delete backups the policy says to delete. Run `./run_tests` to check your work -- it prints a JSON verdict listing the checks that fail -- and run it again before you say you are done."""

[labels]
language = "bash"
family = "feature"
tier = "long"

[limits]
wall_s = 2700
idle_s = 600
oracle_s = 300

[workspace]
seed = "seed"

[[artefact]]
name = "run_tests"
image = "node@sha256:86f07bc9c5dce4578cf37e5a418b7bfc7f817cda25cde66e2b66e95ed86c4567"
inputs = ["oracle/build.mjs", "oracle/run_tests.logic.js"]
command = ["node", "/task/oracle/build.mjs", "/task/oracle/run_tests.logic.js", "/out/run_tests"]
output = "run_tests"
sha256 = "ad3c5f357ddcf930e751645a0d2be3618e3cc8361352540797a6784bc8c1499b"

[[workspace.install]]
artefact = "run_tests"
path = "run_tests"
mode = "0555"

[[oracle]]
name = "tests"
primary = true
artefact = "run_tests"
image = "python@sha256:14a4933e6cef421424f7a66d89a3f4eafcbd0d90e0a822251f298e05132dc735"
command = ["./run_tests"]
expect_pattern = '"ok":true'
timeout_s = 300

[[fixture]]
name = "known-good"
expect = "pass"
[fixture.files]
"rotate.sh" = "fixtures/good/rotate.sh"
"lib/backups.sh" = "fixtures/good/lib/backups.sh"

[[fixture]]
name = "seed"
expect = "fail"

[[fixture]]
name = "calendar-year-weeks"
expect = "fail"
[fixture.files]
"rotate.sh" = "fixtures/bad-week/rotate.sh"
"lib/backups.sh" = "fixtures/bad-week/lib/backups.sh"
